<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900">
  <div class="text-center px-6 max-w-md">
    <!-- Lock icon -->
    <div class="w-24 h-24 mx-auto mb-8 rounded-full bg-red-500/10 flex items-center justify-center ring-2 ring-red-500/30">
      <svg class="w-12 h-12 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>

    <h1 class="text-6xl font-black text-white mb-2">403</h1>
    <h2 class="text-2xl font-bold text-red-400 mb-4">Access Denied</h2>
    <p class="text-slate-400 mb-2 leading-relaxed">
      You don't have permission to access this page.
    </p>
    @if (auth.currentUser()) {
      <p class="text-slate-500 text-sm mb-8">
        Logged in as <span class="text-slate-300 font-medium">{{ auth.currentUser()?.name }}</span>
        with role <span class="text-purple-400 font-medium capitalize">{{ auth.currentUser()?.role }}</span>
      </p>
    }

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button
        (click)="goBack()"
        class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition-colors"
      >
        Go to My Dashboard
      </button>
      <button
        (click)="logout()"
        class="px-6 py-3 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl transition-colors border border-white/20"
      >
        Logout
      </button>
    </div>
  </div>
</div>
