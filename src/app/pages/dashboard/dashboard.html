<div class="flex min-h-screen" style="background-color:var(--page-bg)">

  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Content -->
  <main class="flex-1 lg:ml-64 min-w-0 transition-all duration-300">

    <!-- Top Header Bar -->
    <header class="px-6 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm"
            style="background-color:var(--header-bg);border-bottom:1px solid var(--border-color)">
      <div class="w-10 lg:hidden"></div>
      <div class="flex-1 text-center lg:text-left lg:flex-none">
        <h1 class="text-xl lg:text-2xl font-bold" style="color:var(--text-primary)">Dashboard</h1>
      </div>
      <div class="flex items-center gap-2">
        <!-- Notifications -->
        <button class="w-9 h-9 flex items-center justify-center rounded-xl transition-colors relative"
                style="color:var(--text-secondary)">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full ring-2 ring-white"></span>
        </button>
        <!-- Avatar -->
        <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shadow-sm"
             style="background-color:var(--accent)">
          {{ userInitial }}
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <div class="p-6 lg:p-8 max-w-9xl">

      <!-- Welcome -->
      <div class="mb-8">
        <h2 class="text-lg font-semibold" style="color:var(--text-primary)">
          Welcome back, {{ auth.currentUser()?.name ?? 'Admin' }}! 👋
        </h2>
        <p class="text-sm mt-0.5" style="color:var(--text-secondary)">
          Here's an overview of your user management system.
        </p>
      </div>

      <!-- Stats Cards -->
      <app-dashboard-cards></app-dashboard-cards>

      <!-- User Table -->
      <app-user-table></app-user-table>
    </div>

  </main>
</div>
