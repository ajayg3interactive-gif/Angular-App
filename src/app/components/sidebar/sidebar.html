<!-- ── Mobile Hamburger ── -->
<button
  class="lg:hidden fixed top-4 left-4 z-50 p-2.5 rounded-xl shadow-lg transition-colors text-white"
  style="background-color:var(--sidebar-bg)"
  (click)="toggleMobile()"
  aria-label="Toggle sidebar"
>
  @if (isMobileOpen()) {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  }
</button>

<!-- ── Mobile Overlay ── -->
@if (isMobileOpen()) {
  <div
    class="lg:hidden fixed inset-0 bg-black/50 z-30 backdrop-blur-sm"
    (click)="toggleMobile()"
  ></div>
}

<!-- ── Sidebar ── -->
<aside
  [class]="sidebarClass()"
  style="background-color:var(--sidebar-bg);border-right:1px solid rgba(255,255,255,0.07)"
>

  <!-- Logo -->
  <div class="p-5 flex items-center gap-3" style="border-bottom:1px solid rgba(255,255,255,0.08)">
    <div class="w-9 h-9 rounded-xl flex items-center justify-center shadow-lg shrink-0"
         style="background-color:var(--sidebar-active)">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    <div>
      <p class="text-base font-bold tracking-tight leading-tight text-white">AdminPanel</p>
      <p class="text-xs leading-tight opacity-50 text-white">Management System</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
    <p class="text-xs font-semibold uppercase tracking-widest px-4 py-2 mt-1 opacity-40 text-white">
      Main Menu
    </p>

    <!-- Dashboard -->
    <button
      class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 hover:opacity-100"
      [style.background-color]="activeMenu() === 'dashboard' ? 'var(--sidebar-active)' : 'transparent'"
      [style.color]="activeMenu() === 'dashboard' ? '#ffffff' : 'var(--sidebar-text)'"
      [style.opacity]="activeMenu() === 'dashboard' ? '1' : '0.7'"
      (click)="setActive('dashboard')"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      <span class="flex-1 text-left">Dashboard</span>
      @if (activeMenu() === 'dashboard') {
        <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
      }
    </button>

    <!-- Users -->
    <button
      class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 hover:opacity-100"
      [style.background-color]="activeMenu() === 'users' ? 'var(--sidebar-active)' : 'transparent'"
      [style.color]="activeMenu() === 'users' ? '#ffffff' : 'var(--sidebar-text)'"
      [style.opacity]="activeMenu() === 'users' ? '1' : '0.7'"
      (click)="setActive('users')"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      <span class="flex-1 text-left">Users</span>
      @if (activeMenu() === 'users') {
        <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
      }
    </button>

    <!-- Profile -->
    <button
      class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 hover:opacity-100"
      [style.background-color]="activeMenu() === 'profile' ? 'var(--sidebar-active)' : 'transparent'"
      [style.color]="activeMenu() === 'profile' ? '#ffffff' : 'var(--sidebar-text)'"
      [style.opacity]="activeMenu() === 'profile' ? '1' : '0.7'"
      (click)="setActive('profile')"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      <span class="flex-1 text-left">Profile</span>
      @if (activeMenu() === 'profile') {
        <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
      }
    </button>

    <!-- Divider -->
    <div class="pt-4">
      <p class="text-xs font-semibold uppercase tracking-widest px-4 py-2 opacity-40 text-white">
        Appearance
      </p>
    </div>

    <!-- Dark Mode Toggle -->
    <!-- <div class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium"
         style="color:var(--sidebar-text)">
      <div class="flex items-center gap-3 opacity-70">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <span>Dark Mode</span>
      </div>
      <button
        role="switch"
        [attr.aria-checked]="themeService.isDark()"
        (click)="themeService.toggleDarkMode()"
        class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent
               transition-colors duration-200 focus:outline-none"
        [style.background-color]="themeService.isDark() ? 'var(--sidebar-active)' : 'rgba(255,255,255,0.2)'"
      >
        <span
          class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200"
          [class.translate-x-4]="themeService.isDark()"
          [class.translate-x-0]="!themeService.isDark()"
        ></span>
      </button>
    </div> -->

    <!-- Theme Picker Toggle -->
    <button
      class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 opacity-70 hover:opacity-100"
      style="color:var(--sidebar-text)"
      (click)="toggleThemePicker()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/>
      </svg>
      <span class="flex-1 text-left">Theme</span>
      <span class="text-xs opacity-60 capitalize">{{ themeService.theme() }}</span>
      <svg class="h-4 w-4 opacity-50 transition-transform duration-200"
           [class.rotate-180]="showThemePicker()"
           fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <!-- Inline Theme Swatches -->
    @if (showThemePicker()) {
      <div class="px-4 pb-2">
        <div class="grid grid-cols-5 gap-2">
          @for (t of sidebarThemes; track t.name) {
            <button
              class="flex flex-col items-center gap-1 group"
              (click)="themeService.setTheme(t.name)"
              [attr.title]="t.label"
            >
              <div class="w-8 h-8 rounded-lg border-2 transition-all duration-200"
                   [style.background-color]="t.bg"
                   [style.border-color]="themeService.theme() === t.name ? t.accent : 'rgba(255,255,255,0.15)'"
              >
                <div class="w-full h-1/2 rounded-t-md" [style.background-color]="t.accent"></div>
              </div>
              <span class="text-[9px] opacity-60 text-white leading-none">{{ t.label }}</span>
            </button>
          }
        </div>
      </div>
    }
  </nav>

  <!-- User Info + Logout -->
  <div class="p-4" style="border-top:1px solid rgba(255,255,255,0.08)">
    <!-- User quick info -->
    <button
      class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl mb-2 transition-all duration-200
             hover:bg-white/10 text-left"
      (click)="setActive('profile')"
    >
      <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold text-white shrink-0 shadow-md"
           style="background-color:var(--sidebar-active)">
        {{ userInitial }}
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-white truncate leading-tight">
          {{ auth.currentUser()?.name ?? 'User' }}
        </p>
        <p class="text-xs opacity-50 text-white truncate leading-tight">
          {{ auth.currentUser()?.email ?? '' }}
        </p>
      </div>
      <svg class="h-4 w-4 opacity-40 text-white shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>

    <!-- Logout -->
    <button
      (click)="logout()"
      class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium
             transition-all duration-200 text-red-400 hover:bg-red-500/10 hover:text-red-300"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span>Logout</span>
    </button>
  </div>

</aside>
