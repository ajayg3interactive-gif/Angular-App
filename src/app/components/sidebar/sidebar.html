<!-- ── Mobile Hamburger ── -->
 <div>

  
 </div>
<button class="lg:hidden fixed top-4 left-4 z-50 p-2.5 rounded-xl shadow-lg transition-colors text-white"
  style="background-color:var(--sidebar-bg)"
  (click)="toggleMobile()" aria-label="Toggle sidebar">
  @if (isMobileOpen()) {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  }
</button>

<!-- ── Mobile Overlay ── -->
@if (isMobileOpen()) {
  <div class="lg:hidden fixed inset-0 bg-black/50 z-30 backdrop-blur-sm" (click)="toggleMobile()"></div>
}

<!-- ── Sidebar ── -->
<aside [class]="sidebarClass()" style="background-color:var(--sidebar-bg);border-right:1px solid rgba(255,255,255,0.07)">

  <!-- Logo + Role Badge -->
  <div class="p-5 flex items-center gap-3" style="border-bottom:1px solid rgba(255,255,255,0.08)">
    <div class="w-9 h-9 rounded-xl flex items-center justify-center shadow-lg shrink-0"
         style="background-color:var(--sidebar-active)">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    <div>
      <p class="text-base font-bold tracking-tight leading-tight text-white">ProManager</p>
      <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold capitalize leading-tight"
        [style.background-color]="rbac.isAdmin() ? '#6366f120' : rbac.isDeveloper() ? '#0891b220' : '#05966920'"
        [style.color]="rbac.isAdmin() ? '#818cf8' : rbac.isDeveloper() ? '#22d3ee' : '#34d399'">
        {{ rbac.roleLabel() }}
      </span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 p-2 space-y-1 overflow-y-auto scrollbar-none">

    <p class="text-xs font-semibold uppercase tracking-widest px-4 mt-1 opacity-40 text-white">Menu</p>

    @for (item of navItems(); track item.key) {
      <button
        class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 hover:opacity-100"
        [style.background-color]="isActive(item.route) ? 'var(--sidebar-active)' : 'transparent'"
        [style.color]="isActive(item.route) ? '#ffffff' : 'var(--sidebar-text)'"
        [style.opacity]="isActive(item.route) ? '1' : '0.7'"
        (click)="navigate(item.route)">

        <!-- Dynamic SVG icon -->
        <span class="w-5 h-5 shrink-0 flex items-center justify-center">
          @switch (item.icon) {
            @case ('grid') {
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
              </svg>
            }
            @case ('folder') {
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h4l2 2h6a2 2 0 012 2v7a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>
              </svg>
            }
            @case ('board') {
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/>
              </svg>
            }
            @case ('users') {
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
              </svg>
            }
            @case ('user-cog') {
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            }
            @case ('chart') {
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
              </svg>
            }
            @case ('cog') {
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            }
            @case ('check') {
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
              </svg>
            }
          }
        </span>

        <span class="flex-1 text-left">{{ item.label }}</span>
        @if (isActive(item.route)) {
          <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
        }
      </button>
    }

    <!-- Divider -->
    <div class="pt-2">
      <p class="text-xs font-semibold uppercase tracking-widest px-4  opacity-40 text-white">Account</p>
    </div>

    <!-- Bottom items (Notifications, Profile) -->
    @for (item of bottomItems(); track item.key) {
      <button
        class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 hover:opacity-100"
        [style.background-color]="isActive(item.route) ? 'var(--sidebar-active)' : 'transparent'"
        [style.color]="isActive(item.route) ? '#ffffff' : 'var(--sidebar-text)'"
        [style.opacity]="isActive(item.route) ? '1' : '0.7'"
        (click)="navigate(item.route)">

        <span class="w-5 h-5 shrink-0 flex items-center justify-center relative">
          @if (item.icon === 'bell') {
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            @if (notifSvc.unreadCount() > 0) {
              <span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 rounded-full text-[8px] text-white flex items-center justify-center font-bold leading-none">
                {{ notifSvc.unreadCount() > 9 ? '9+' : notifSvc.unreadCount() }}
              </span>
            }
          } @else {
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          }
        </span>

        <span class="flex-1 text-left">{{ item.label }}</span>
        @if (isActive(item.route)) {
          <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
        }
      </button>
    }

    @if (showThemePicker()) {
      <div class="px-4 pb-2">
        <div class="grid grid-cols-5 gap-2">
          @for (t of sidebarThemes; track t.name) {
            <button class="flex flex-col items-center gap-1 group" (click)="themeService.setTheme(t.name)" [attr.title]="t.label">
              <div class="w-8 h-8 rounded-lg border-2 transition-all duration-200"
                   [style.background-color]="t.bg"
                   [style.border-color]="themeService.theme() === t.name ? t.accent : 'rgba(255,255,255,0.15)'">
                <div class="w-full h-1/2 rounded-t-md" [style.background-color]="t.accent"></div>
              </div>
              <span class="text-[9px] opacity-60 text-white leading-none">{{ t.label }}</span>
            </button>
          }
        </div>
      </div>
    }
  </nav>

  <!-- User Footer -->
  <div class="px-4 py-2" style="border-top:1px solid rgba(255,255,255,0.08)">
    <button (click)="logout()"
      class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 text-red-400 hover:bg-red-500/10 hover:text-red-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span>Logout</span>
    </button>
  </div>

</aside>
