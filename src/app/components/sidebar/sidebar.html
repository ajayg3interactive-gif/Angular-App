<!-- Mobile Hamburger -->
<button
  class="lg:hidden fixed top-4 left-4 z-50 bg-slate-800 text-white p-2.5 rounded-xl shadow-lg hover:bg-slate-700 transition-colors"
  (click)="toggleMobile()"
  aria-label="Toggle sidebar"
>
  @if (isMobileOpen()) {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  }
</button>

<!-- Mobile Overlay -->
@if (isMobileOpen()) {
  <div
    class="lg:hidden fixed inset-0 bg-black/50 z-30 backdrop-blur-sm"
    (click)="toggleMobile()"
  ></div>
}

<!-- Sidebar -->
<aside [class]="sidebarClass()">

  <!-- Logo -->
  <div class="p-6 border-b border-slate-700/50">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-indigo-500 rounded-xl flex items-center justify-center shadow-lg shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <div>
        <p class="text-base font-bold tracking-tight leading-tight">AdminPanel</p>
        <p class="text-xs text-slate-400 leading-tight">Management System</p>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
    <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest px-4 py-2 mt-1">Main Menu</p>

    <!-- Dashboard -->
    <button [class]="navClass('dashboard')" (click)="setActive('dashboard')">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="flex-1 text-left">Dashboard</span>
      @if (activeMenu() === 'dashboard') {
        <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
      }
    </button>

    <!-- Users -->
    <button [class]="navClass('users')" (click)="setActive('users')">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <span class="flex-1 text-left">Users</span>
      @if (activeMenu() === 'users') {
        <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
      }
    </button>
  </nav>

  <!-- Profile + Logout -->
  <div class="p-4 border-t border-slate-700/50 space-y-3">
    <div class="flex items-center gap-3 px-2 py-1">
      <div class="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center text-xs font-bold shrink-0">A</div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-white truncate">Admin User</p>
        <p class="text-xs text-slate-400 truncate">***&#64;***.com</p>
      </div>
    </div>
    <button
      (click)="logout()"
      class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-all duration-200 text-sm font-medium"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span>Logout</span>
    </button>
  </div>

</aside>
